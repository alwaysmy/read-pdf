# engine_config.local.example.yaml — 本机私有覆盖模板
# 复制为 engine_config.local.yaml（已 gitignore）后按本机情况修改：
#   - 填云端真实 token（cloud api_key）
#   - 换模型路径 / 端口 / 本体服务端口
# 本文件提交；engine_config.local.yaml 不提交
engines:
  # 示例：本机填云端 token（hybrid 与 paddle_vl 两处）
  hybrid:
    sources:
      cloud:
        api_key: "your-aistudio-token-here"
  paddle_vl:
    sources:
      cloud:
        api_key: "your-aistudio-token-here"

  # 示例：换 GLM 模型路径
  # glm:
  #   sources:
  #     local:
  #       server:
  #         model: "D:/my/models/GLM-OCR-Q8_0.gguf"
  #         port: 12335

# 示例：改本体 HTTP 服务端口（server.py / mcp_server.py 默认 8123）
# server:
#   host: "127.0.0.1"
#   port: 9000
