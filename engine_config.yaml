# read-pdf 引擎配置（双源模型：local/cloud）
# 本机私有覆盖：engine_config.local.yaml（gitignore，本地优先合并）
# 云端密钥只用占位符；真实 token 填 engine_config.local.yaml（gitignore，不进仓库）
defaults:
  llama_dir: "D:/llm/llama-b9830-bin-win-cuda-13.3-x64"   # llama-server 目录（本地源用）
  device: gpu                # 本地服务默认设备：gpu | cpu（默认 gpu）
  gpu_fallback: true         # 配置 gpu 但检测不到 GPU 时：告警并回退 cpu（仅本地服务）
  ocr_device: "cpu"          # --ov 进程内 OCR 设备：cpu | gpu
                             # gpu 需 CUDA 版 paddlepaddle（官方索引装 paddlepaddle-gpu）；
                             # 配 gpu 但环境不支持时会告警并回退 cpu。本机覆盖写 engine_config.local.yaml
  ocr_backend: "auto"        # --ov 后端：auto | gpu | openvino | cpu
                             # auto 择优：gpu(paddle+CUDA) > openvino(CPU) > cpu(paddle)
                             # 整页 A4 密排实测 ≈ 2.0s / 4.6s / 35s
  ocr_ov_dir: ""             # --ov 的 OpenVINO 模型目录（PP-OCRv6 ONNX + 字典）
                             # 留空则用仓库内 models/；指向自备模型目录可覆盖（本机私有填 local.yaml）
  ocr_model_tier: "small"    # --ov 的模型规格：tiny | small | medium（v6 无 large）
                             # 仅作用于 paddle 后端（gpu/cpu）；OpenVINO 只有 small 的 ONNX。
                             # 整页 A4 实测：干净页 small/medium 基本持平而 medium 慢约 2x；
                             # 劣质输入（96dpi）medium 明显更稳——最低行置信度 0.63 vs 0.32

server:                     # 本体 HTTP 服务（server.py / mcp_server.py 默认地址）
  host: "127.0.0.1"         # 仅本机
  port: 8123                # 撞端口可改（engine_config.local.yaml 覆盖）

engines:
  hybrid:                 # PaddleOCR Hybrid — 图像 PDF 默认（质量最稳）
    default_source: local      # 默认服务源：local | cloud
    prompt: ""                 # 引擎行为（两源共用，不随源变）
    max_tokens: 4096
    message_order: image-first
    output_format: markdown    # text|markdown|html
    sources:
      local:                   # 本地源：llama-server 服务
        endpoint: "http://127.0.0.1:12336/v1"
        api_key: "12345"
        server:
          exe: llama-server.exe
          model: "D:/llm/PaddlePaddle/PaddleOCR-VL-1.6-GGUF/PaddleOCR-VL-1.6-GGUF.gguf"
          mmproj: "D:/llm/PaddlePaddle/PaddleOCR-VL-1.6-GGUF/PaddleOCR-VL-1.6-GGUF-mmproj.gguf"
          port: 12336
          vram_required_mib: 3500
          args: ["-ngl","100","--no-mmap","--no-warmup","-c","8192","-t","8","-np","1"]
      cloud:                   # 云源：PaddleOCR AI Studio（同款模型云端版，job 模式）
        endpoint: "https://paddleocr.aistudio-app.com/api/v2/ocr/jobs"
        api_key: "12345"
        model: "PaddleOCR-VL-1.6"     # 云 API 模型名（job 模式）
        optional_payload:
          useDocOrientationClassify: false
          useDocUnwarping: false
          useChartRecognition: false
        server: null           # 云源无本地服务段

  glm:                    # GLM-OCR Q8_0 — 公式/数值表格保真（仅本地）
    default_source: local
    prompt: "Text Recognition:"
    max_tokens: 4096
    message_order: image-first
    output_format: markdown
    sources:
      local:
        endpoint: "http://127.0.0.1:12335/v1"
        api_key: "12345"
        server:
          exe: llama-server.exe
          model: "D:/llm/ggml-org/GLM-OCR-GGUF/GLM-OCR-Q8_0.gguf"
          mmproj: "D:/llm/ggml-org/GLM-OCR-GGUF/mmproj-GLM-OCR-Q8_0.gguf"
          port: 12335
          vram_required_mib: 3500
          args: ["-ngl","100","--no-mmap","--no-warmup","-c","16384","-t","8","-np","1"]

  dsocr:                  # DeepSeek-OCR — 纯文本扫描件提速（快 45%）（仅本地）
    default_source: local
    prompt: "OCR markdown"
    max_tokens: 8192
    message_order: text-first    # DeepSeek 要求 text 在前
    output_format: markdown
    sources:
      local:
        endpoint: "http://127.0.0.1:12337/v1"
        api_key: "12345"
        server:
          exe: llama-server.exe
          model: "D:/llm/ggml-org/DeepSeek-OCR/DeepSeek-OCR-Q8_0.gguf"
          mmproj: "D:/llm/ggml-org/DeepSeek-OCR/mmproj-DeepSeek-OCR-Q8_0.gguf"
          port: 12337
          vram_required_mib: 4500
          args: ["-ngl","100","--no-mmap","--no-warmup","-c","8192","-t","8","-np","1"]

  qwen:                   # Qwen3.6-35B-A3B — 知识审校（仅本地，--audit）
    default_source: local
    prompt: ""
    max_tokens: 8192
    message_order: image-first
    output_format: html
    sources:
      local:
        endpoint: "http://127.0.0.1:12334/v1"
        api_key: "12345"
        server:
          exe: llama-server.exe
          model: "D:/llm/HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-IQ4_NL.gguf"
          mmproj: "D:/llm/HauhauCS/Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive/mmproj-Qwen3.6-35B-A3B-Uncensored-HauhauCS-Aggressive-f16.gguf"
          port: 12334
          vram_required_mib: 5500
          args: ["-ngl","100","-ncmoe","32","--no-mmap","--no-warmup","-fa","on","-fit","on","--cache-type-k","q8_0","--cache-type-v","q8_0","--no-context-shift","--spec-type","ngram-mod","--spec-ngram-mod-n-max","16","--spec-ngram-mod-n-min","8","-c","131072","-n","131072","-t","8","-np","1"]
          env: {"LLAMA_CHAT_TEMPLATE_KWARGS": '{"enable_thinking":false}'}

  paddle_vl:              # PaddleOCR-VL 云端解析（官方 AI Studio，云源专用）
    default_source: cloud
    prompt: ""
    max_tokens: 0
    message_order: image-first
    output_format: markdown
    sources:
      cloud:
        endpoint: "https://paddleocr.aistudio-app.com/api/v2/ocr/jobs"
        api_key: "12345"
        model: "PaddleOCR-VL-1.6"
        optional_payload:
          useDocOrientationClassify: false
          useDocUnwarping: false
          useChartRecognition: false
        server: null

# 引擎路由：默认排序（agent 可按场景覆盖）
routing:
  text_pdf: ["pdfmux", "pdfplumber"]        # 文本层 PDF
  image_pdf: ["hybrid", "glm", "dsocr"]     # 图像 PDF 默认优先级（本地源）
  image_pdf_cloud: ["hybrid", "paddle_vl"]  # 无 GPU / 切云源时的兜底链
  quality_fallback: ["glm"]                 # 公式/表格质量兜底
